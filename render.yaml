# Render blueprint: the game server plus a Postgres database for saved games, players and lessons.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> fill in the three secrets.
#
# Plans: "free" works out of the box. Render deletes free databases after 30 days, so for a
# long-lived deployment change the database plan to "basic-256mb" (or point DATABASE_URL at any
# other Postgres, e.g. a free Neon database, and remove the databases block).
databases:
  - name: bribot-db
    plan: free

services:
  - type: web
    name: bribot
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: bribot-db
          property: connectionString
      # Secrets: entered in the Render dashboard, never stored in the repo.
      - key: SERV_API_KEY
        sync: false
      - key: REPPO_API_KEY
        sync: false
      - key: KITE_PRIVATE_KEY
        sync: false
      # Real payments on Kite testnet, paid in KITE, with small amounts.
      - key: KITE_MODE
        value: chain
      - key: KITE_TOKEN_ADDRESS
        value: native
      - key: BOT_STAKE
        value: 0.05
      - key: BRIBE_MAX
        value: 0.02
      - key: BRIBE_BUDGET
        value: 0.04
      - key: BOT_DAILY_CAP
        value: 0.4
      - key: SERV_MODEL
        value: gpt-5.4-mini
      # Ceilings that protect your SERV and Reppo credits from heavy public use.
      - key: MAX_GAMES_PER_DAY
        value: 200
      - key: MAX_ROOMS
        value: 40
      - key: ROOMS_PER_IP_PER_HOUR
        value: 8
