# Render blueprint: the game server. Saved games, players and lessons live in an external
# Postgres database (a free Neon database works and does not expire).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> fill in the four secrets.

services:
  - type: web
    name: bribot
    runtime: node
    plan: free
    region: frankfurt # keep this next to the database region
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Secrets: entered in the Render dashboard, never stored in the repo.
      - key: DATABASE_URL # Postgres connection string, e.g. from Neon
        sync: false
      - key: SERV_API_KEY
        sync: false
      - key: REPPO_API_KEY
        sync: false
      - key: KITE_PRIVATE_KEY
        sync: false
      # Real payments on Kite testnet, paid in KITE, with small amounts.
      - key: KITE_MODE
        value: chain
      - key: KITE_TOKEN_ADDRESS
        value: native
      - key: BOT_STAKE
        value: 0.05
      - key: BRIBE_MAX
        value: 0.02
      - key: BRIBE_BUDGET
        value: 0.04
      - key: BOT_DAILY_CAP
        value: 0.4
      - key: SERV_MODEL
        value: gpt-5.4-mini
      # Ceilings that protect your SERV and Reppo credits from heavy public use.
      - key: MAX_GAMES_PER_DAY
        value: 200
      - key: MAX_ROOMS
        value: 40
      - key: ROOMS_PER_IP_PER_HOUR
        value: 8
